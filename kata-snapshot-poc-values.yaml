# Helm values for Sandbox Service + Sandbox Agent in "pod" mode (no Kata components)
# Deploy with: helm install kata ./tools/packaging/kata-deploy/helm-chart/kata-deploy -f kata-snapshot-poc-values.yaml

# Disable Kata runtime deployment - only deploy sandbox-service and sandbox-agent
kataDeploy:
  enabled: false

imagePullPolicy: Always

# Debug mode - enable for troubleshooting
debug: true

# Disable NFD (not needed without Kata)
node-feature-discovery:
  enabled: false

sandboxAgent:
  enabled: true
  image:
    reference: gcr.io/cohere-artifacts/sandbox-agent
    tag: "latest"

  # Run in pod mode (regular pods via CRI, no Kata VMs)
  mode: pod

  # Node selector for the sandbox-agent DaemonSet.
  # To limit agents to specific nodes, label those nodes and select them here.
  # Example: kubectl label node <node-name> sandbox-agent=enabled
  nodeSelector:
    sandbox-agent: "enabled"

  # Node labeling - agents will label their nodes on startup.
  # Sandbox pods are automatically scheduled to nodes with this label.
  nodeLabel:
    enabled: true
    key: "sandbox.kata.io/agent"
    value: "true"

  # Sandbox pod configuration (managed by sandbox-agent)
  sandboxNamespace: aaron-sandbox-tool
  # Additional node selectors for sandbox pods (nodeLabel is auto-added when enabled)
  sandboxNodeSelector:

  # CRI socket auto-detected (containerd or CRI-O)
  cri:
    socket: ""
    timeout: "30s"

  # Host filesystem for emptyDir access
  hostfs:
    kubeletRoot: "/var/lib/kubelet"

  # Storage configuration for snapshot save/restore
  storage:
    enabled: false
    # Address of sandbox-service's storage gRPC server
    addr: "kata-deploy-sandbox-service.kata-system:9090"
    timeout: "30s"
    # Init container image for snapshot restore (should have wget and tar)
    initImage: "busybox:1.36"

sandboxService:
  enabled: true
  image:
    reference: gcr.io/cohere-artifacts/sandbox-service
    tag: "latest"

  defaultTTL: "3m"

  # Default sandbox image (using public image to avoid GCR auth issues)
  defaultImage: "python:3.11-slim"
  defaultCommand: ["sleep", "infinity"]

  # Storage configuration for snapshot save/restore (S3-compatible backend)
  storage:
    enabled: false
    # S3-compatible endpoint URL (s3proxy in kata-system namespace)
    endpoint: "http://s3proxy.kata-system:8080"
    region: "us-east-1"
    bucket: "snapshots"
    # Credentials matching s3proxy.yaml
    accessKeyId: "s3proxy-access-key"
    secretAccessKey: "s3proxy-secret-key"
    presignExpiry: "15m"
    forcePathStyle: true
