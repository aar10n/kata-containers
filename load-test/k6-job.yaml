apiVersion: v1
kind: ConfigMap
metadata:
  name: k6-load-test
  namespace: kata-system
data:
  k6-sandbox-test.js: |
    // k6 Load Test - Each VU creates ONE sandbox and reuses it
    import http from 'k6/http';
    import { check, sleep } from 'k6';
    import { Trend, Counter, Rate } from 'k6/metrics';
    import { randomIntBetween } from 'https://jslib.k6.io/k6-utils/1.2.0/index.js';

    const sandboxCreateLatency = new Trend('sandbox_create_latency', true);
    const shellLatency = new Trend('shell_latency', true);
    const pythonLatency = new Trend('python_latency', true);
    const sandboxErrors = new Counter('sandbox_errors');
    const successRate = new Rate('success_rate');
    const commandsExecuted = new Counter('commands_executed');

    const BASE_URL = __ENV.BASE_URL || 'http://kata-deploy-sandbox-service.kata-system:8080';
    const SCENARIO = __ENV.SCENARIO || 'standard';

    const scenarios = {
      smoke: { executor: 'constant-vus', vus: 2, duration: '1m' },
      standard: {
        executor: 'ramping-vus',
        startVUs: 0,
        stages: [
          { duration: '1m', target: 10 },
          { duration: '3m', target: 10 },
          { duration: '1m', target: 25 },
          { duration: '3m', target: 25 },
          { duration: '1m', target: 50 },
          { duration: '3m', target: 50 },
          { duration: '2m', target: 0 },
        ],
      },
      stress: {
        executor: 'ramping-vus',
        startVUs: 0,
        stages: [
          { duration: '2m', target: 25 },
          { duration: '3m', target: 50 },
          { duration: '3m', target: 100 },
          { duration: '3m', target: 150 },
          { duration: '3m', target: 200 },
          { duration: '2m', target: 0 },
        ],
      },
      spike: {
        executor: 'ramping-vus',
        startVUs: 0,
        stages: [
          { duration: '30s', target: 10 },
          { duration: '10s', target: 100 },
          { duration: '2m', target: 100 },
          { duration: '30s', target: 10 },
          { duration: '1m', target: 10 },
          { duration: '30s', target: 0 },
        ],
      },
      soak: { executor: 'constant-vus', vus: 30, duration: '30m' },
    };

    export const options = {
      scenarios: { default: scenarios[SCENARIO] || scenarios.standard },
      thresholds: {
        http_req_duration: ['p(95)<5000', 'p(99)<10000'],
        http_req_failed: ['rate<0.05'],
        sandbox_create_latency: ['p(95)<10000'],
        shell_latency: ['p(95)<3000'],
        success_rate: ['rate>0.95'],
      },
      teardownTimeout: '60s',
    };

    function makeRequest(method, path, body = null) {
      const url = `${BASE_URL}${path}`;
      const params = { headers: { 'Content-Type': 'application/json' }, timeout: '30s' };
      if (method === 'GET') return http.get(url, params);
      if (method === 'POST') return http.post(url, body ? JSON.stringify(body) : null, params);
      if (method === 'DELETE') return http.del(url, null, params);
    }

    export function setup() {
      console.log(`Load test: ${BASE_URL}, scenario: ${SCENARIO}`);
      const res = http.get(`${BASE_URL}/healthz`, { timeout: '5s' });
      if (res.status !== 200) throw new Error(`Service not healthy: ${res.status}`);
      console.log('Service healthy');
      return { startTime: Date.now() };
    }

    export default function(data) {
      const sessionId = `loadtest-vu${__VU}`;

      // First iteration - create sandbox
      if (__ITER === 0) {
        const start = Date.now();
        const res = makeRequest('POST', `/v1/${sessionId}/exec`, {
          command: ['echo', 'sandbox-ready'],
          timeout_ms: 15000,
        });
        sandboxCreateLatency.add(Date.now() - start);
        const ok = check(res, { 'sandbox created': (r) => r.status === 200 });
        successRate.add(ok);
        if (!ok) {
          sandboxErrors.add(1);
          console.log(`VU ${__VU}: Failed to create sandbox`);
          sleep(5);
          return;
        }
        console.log(`VU ${__VU}: Sandbox ready`);
        sleep(1);
      }

      // Run commands against existing sandbox
      runCommandBatch(sessionId);
      sleep(randomIntBetween(1, 3));
    }

    function runCommandBatch(sessionId) {
      const rand = Math.random();
      if (rand < 0.5) {
        runShellCommands(sessionId, randomIntBetween(3, 6));
      } else if (rand < 0.8) {
        runPythonCode(sessionId);
      } else {
        runShellCommands(sessionId, 2);
        runPythonCode(sessionId);
        runShellCommands(sessionId, 2);
      }
    }

    function runShellCommands(sessionId, count) {
      const commands = [
        'echo "hello"', 'pwd && ls -la', 'date && uptime',
        'cat /etc/os-release | head -3', 'env | head -10',
        'for i in 1 2 3; do echo "loop $i"; done',
      ];
      for (let i = 0; i < count; i++) {
        const cmd = commands[Math.floor(Math.random() * commands.length)];
        const start = Date.now();
        const res = makeRequest('POST', `/v1/${sessionId}/shell`, { command: cmd, timeout_ms: 10000 });
        shellLatency.add(Date.now() - start);
        commandsExecuted.add(1);
        const ok = check(res, { 'shell ok': (r) => r.status === 200 });
        successRate.add(ok);
        if (!ok) sandboxErrors.add(1);
        sleep(randomIntBetween(0.5, 2));
      }
    }

    function runPythonCode(sessionId) {
      const snippets = [
        'print("Hello")\nprint(sum(range(100)))',
        'import sys\nprint(f"Python {sys.version_info.major}.{sys.version_info.minor}")',
        'result = [x**2 for x in range(10)]\nprint(result)',
      ];
      const code = snippets[Math.floor(Math.random() * snippets.length)];
      const start = Date.now();
      const res = makeRequest('POST', `/v1/${sessionId}/repl/python`, { code: code, timeout_ms: 15000 });
      pythonLatency.add(Date.now() - start);
      commandsExecuted.add(1);
      const ok = check(res, { 'python ok': (r) => r.status === 200 });
      successRate.add(ok);
      if (!ok) sandboxErrors.add(1);
      sleep(randomIntBetween(1, 3));
    }

    export function teardown(data) {
      console.log(`Test completed in ${((Date.now() - data.startTime) / 1000).toFixed(1)}s`);
    }
---
apiVersion: batch/v1
kind: Job
metadata:
  name: k6-load-test
  namespace: kata-system
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app: k6-load-test
    spec:
      restartPolicy: Never
      nodeSelector:
        cloud.google.com/gke-os-distribution: cos
      containers:
        - name: k6
          image: grafana/k6:latest
          command:
            - k6
            - run
            - /scripts/k6-sandbox-test.js
          env:
            - name: BASE_URL
              value: "http://kata-deploy-sandbox-service.kata-system:8080"
            - name: SCENARIO
              value: "smoke"
          volumeMounts:
            - name: scripts
              mountPath: /scripts
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: scripts
          configMap:
            name: k6-load-test
