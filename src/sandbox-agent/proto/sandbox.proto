syntax = "proto3";

package sandbox.v1;

option go_package = "github.com/cohere-ai/kata-containers/src/sandbox-agent/pkg/api/pb;pb";

import "google/api/annotations.proto";
import "google/protobuf/empty.proto";

service SandboxAgent {
  rpc Health(google.protobuf.Empty) returns (HealthResponse) {
    option (google.api.http) = { get: "/healthz" };
  }

  // Sandbox lifecycle management
  rpc CreateSandbox(CreateSandboxRequest) returns (SandboxInfo) {
    option (google.api.http) = { post: "/v1/sandboxes" body: "*" };
  }
  rpc GetSandbox(GetSandboxRequest) returns (SandboxInfo) {
    option (google.api.http) = { get: "/v1/sandboxes/{session_id}" };
  }
  rpc DeleteSandbox(DeleteSandboxRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = { delete: "/v1/sandboxes/{session_id}" };
  }
  rpc ListSandboxes(ListSandboxesRequest) returns (ListSandboxesResponse) {
    option (google.api.http) = { get: "/v1/sandboxes" };
  }
  rpc UpdateSandboxActivity(UpdateSandboxActivityRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = { post: "/v1/sandboxes/{session_id}/activity" };
  }
  // SuspendSandbox snapshots the sandbox's /data directory, uploads to S3, and deletes the pod.
  // Only supported in pod mode with storage enabled.
  rpc SuspendSandbox(SuspendSandboxRequest) returns (SuspendSandboxResponse) {
    option (google.api.http) = { post: "/v1/sandboxes/{session_id}/suspend" body: "*" };
  }

  // Command execution
  rpc Exec(ExecRequest) returns (ExecResponse) {
    option (google.api.http) = { post: "/v1/exec" body: "*" };
  }

  // Process management (interactive/streaming)
  rpc StartProcess(StartProcessRequest) returns (StartProcessResponse) {
    option (google.api.http) = { post: "/v1/process/start" body: "*" };
  }
  rpc WriteToProcess(WriteToProcessRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = { post: "/v1/process/write" body: "*" };
  }
  rpc ReadProcessStdout(ReadProcessOutputRequest) returns (ReadProcessOutputResponse) {
    option (google.api.http) = { post: "/v1/process/read/stdout" body: "*" };
  }
  rpc ReadProcessStderr(ReadProcessOutputRequest) returns (ReadProcessOutputResponse) {
    option (google.api.http) = { post: "/v1/process/read/stderr" body: "*" };
  }
  rpc CloseProcessStdin(CloseProcessStdinRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = { post: "/v1/process/close-stdin" body: "*" };
  }
  rpc KillProcess(KillProcessRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = { post: "/v1/process/kill" body: "*" };
  }
  rpc WaitProcess(WaitProcessRequest) returns (WaitProcessResponse) {
    option (google.api.http) = { post: "/v1/process/wait" body: "*" };
  }
  rpc ResizeTerminal(ResizeTerminalRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = { post: "/v1/process/resize" body: "*" };
  }
  // StreamProcessOutput streams stdout and stderr from a process in real-time.
  // This is more efficient than polling ReadProcessStdout/ReadProcessStderr.
  rpc StreamProcessOutput(StreamProcessOutputRequest) returns (stream ProcessOutputChunk);

  // File operations
  rpc ReadFile(ReadFileRequest) returns (ReadFileResponse) {
    option (google.api.http) = { post: "/v1/files/read" body: "*" };
  }
  rpc WriteFile(WriteFileRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = { post: "/v1/files/write" body: "*" };
  }
  rpc ReadArchive(ReadArchiveRequest) returns (stream ArchiveChunk);
  rpc WriteArchive(stream WriteArchiveRequest) returns (WriteArchiveResponse);

  // VM state management (kata mode only)
  rpc SaveVMState(SaveVMStateRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = { post: "/v1/vm/save-state" body: "*" };
  }
  rpc RestoreVMState(RestoreVMStateRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = { post: "/v1/vm/restore-state" body: "*" };
  }
}

message HealthResponse {
  string status = 1;
  string mode = 2;  // "kata" or "pod"
}

// Sandbox lifecycle messages
message CreateSandboxRequest {
  string session_id = 1;
  string image = 2;
  repeated string command = 3;
  map<string, string> env = 4;
  map<string, string> labels = 5;
  // Presigned GET URL for downloading a snapshot to restore (pod mode only).
  // If set, an init container will download and extract the snapshot into /data.
  // Ignored when fuse_storage is enabled.
  string download_url = 6;
  // Optional user ID. When provided and fuse_storage is enabled, enables
  // the /mydrive mount backed by S3 at assets_bucket/my-drive/{user_id}/.
  string user_id = 7;
}

message GetSandboxRequest {
  string session_id = 1;
}

message DeleteSandboxRequest {
  string session_id = 1;
}

message ListSandboxesRequest {
  string node = 1;  // optional filter by node
}

message ListSandboxesResponse {
  repeated SandboxInfo sandboxes = 1;
}

message UpdateSandboxActivityRequest {
  string session_id = 1;
}

message SandboxInfo {
  string session_id = 1;
  string sandbox_id = 2;
  repeated ContainerInfo containers = 3;
  string status = 4;  // pending, running, failed, terminated
  string node = 5;
  int64 created_at_unix = 6;
  int64 last_used_at_unix = 7;
  map<string, string> labels = 8;
}

message ContainerInfo {
  string name = 1;
  string container_id = 2;
}

// Command execution
message ExecRequest {
  string session_id = 1;
  string vm_id = 2;  // deprecated, use session_id
  repeated string args = 3;
  repeated string env = 4;
  string cwd = 5;
  int64 timeout_ms = 6;
  // Optional user ID. Currently unused but reserved for future use.
  string user_id = 7;
}

message ExecResponse {
  string stdout = 1;
  string stderr = 2;
  int32 exit_code = 3;
}

// Process management
message StartProcessRequest {
  string session_id = 1;
  repeated string command = 2;
  repeated string env = 3;
  string cwd = 4;
  bool tty = 5;
  // Optional user ID. Currently unused but reserved for future use.
  string user_id = 6;
}

message StartProcessResponse {
  string process_id = 1;
  string container_id = 2;
}

message WriteToProcessRequest {
  string session_id = 1;
  string process_id = 2;
  bytes data = 3;
}

message ReadProcessOutputRequest {
  string session_id = 1;
  string process_id = 2;
  int32 max_bytes = 3;
}

message ReadProcessOutputResponse {
  bytes data = 1;
}

message CloseProcessStdinRequest {
  string session_id = 1;
  string process_id = 2;
}

message KillProcessRequest {
  string session_id = 1;
  string process_id = 2;
  int32 signal = 3;
}

message WaitProcessRequest {
  string session_id = 1;
  string process_id = 2;
}

message WaitProcessResponse {
  int32 exit_code = 1;
}

message ResizeTerminalRequest {
  string session_id = 1;
  string process_id = 2;
  uint32 rows = 3;
  uint32 cols = 4;
}

// Streaming process output
message StreamProcessOutputRequest {
  string session_id = 1;
  string process_id = 2;
}

message ProcessOutputChunk {
  enum Stream {
    STDOUT = 0;
    STDERR = 1;
  }
  Stream stream = 1;
  bytes data = 2;
}

// File operations
message ReadFileRequest {
  string session_id = 1;
  string path = 2;
}

message ReadFileResponse {
  bytes content = 1;
}

message WriteFileRequest {
  string session_id = 1;
  string path = 2;
  bytes content = 3;
  uint32 mode = 4;  // file permissions (optional)
}

message ReadArchiveRequest {
  string session_id = 1;
  string path = 2;  // file or directory to archive
}

message ArchiveChunk {
  bytes data = 1;  // tar data chunk
}

message WriteArchiveRequest {
  oneof request {
    WriteArchiveHeader header = 1;  // first message: metadata
    bytes data = 2;                  // subsequent: tar data chunks
  }
}

message WriteArchiveHeader {
  string session_id = 1;
  string dest_dir = 2;  // destination directory
}

message WriteArchiveResponse {
  int64 bytes_written = 1;
}

// VM state management
message SaveVMStateRequest {
  string session_id = 1;
  string vm_id = 2;  // deprecated, use session_id
  string path = 3;
}

message RestoreVMStateRequest {
  string session_id = 1;
  string vm_id = 2;  // deprecated, use session_id
  string path = 3;
}

// Suspend/snapshot messages (pod mode only)
message SuspendSandboxRequest {
  string session_id = 1;
}

message SuspendSandboxResponse {
  // Size of the uploaded snapshot in bytes
  int64 snapshot_size = 1;
  // Time taken to create and upload snapshot in milliseconds
  int64 duration_ms = 2;
}
