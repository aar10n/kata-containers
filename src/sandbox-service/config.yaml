# sandbox-service configuration
#
# Configuration can be overridden via:
# - Command-line flags (highest priority)
# - Environment variables with SANDBOX_SERVICE_ prefix (e.g., SANDBOX_SERVICE_PLATFORM)
# - This config file
# - Defaults (lowest priority)

http:
  addr: ":8080"

# Platform: "kata" or "docker"
platform: kata

kata:
  # Address of the sandbox-agent service (required for kata platform)
  sandbox_agent_addr: "http://kata-deploy-sandbox-agent.kata-system:8080"
  # Container names for multi-container sandbox support
  main_container: "sandbox"
  shell_container: "shell"

exec:
  default_timeout: 30s
  max_output_bytes: 1048576

sandbox:
  default_ttl: 10m
  cleanup_interval: 30s
  # Default container image for sandboxes
  default_image: "python:3.11-slim"
  # Default command for sandbox containers
  default_command: ["sleep", "infinity"]
