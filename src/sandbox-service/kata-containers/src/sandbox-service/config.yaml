http:
  addr: ":8080"

platform: kata

kata:
  namespace: kata-sandboxes
  runtime_class: kata-qemu
  node_selector:
    katacontainers.io/kata-runtime: "true"
  default_image: "python:3.11-slim"
  default_command: ["sleep", "infinity"]
  sandbox_agent_addr: "http://kata-deploy-sandbox-agent.kata-system:8080"

docker:
  default_image: "python:3.11-slim"
  default_command: ["sleep", "infinity"]

exec:
  default_timeout: 30s
  max_output_bytes: 1048576
