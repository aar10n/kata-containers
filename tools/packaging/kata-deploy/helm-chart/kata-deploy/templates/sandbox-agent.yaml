{{- if .Values.sandboxAgent.enabled }}
{{- $name := printf "%s-sandbox-agent" .Chart.Name -}}
{{- if .Values.env.multiInstallSuffix }}
{{- $name = printf "%s-%s" $name .Values.env.multiInstallSuffix -}}
{{- end }}

# Namespace for sandbox pods (if different from release namespace)
{{- if ne .Values.sandboxAgent.sandboxNamespace .Release.Namespace }}
apiVersion: v1
kind: Namespace
metadata:
  name: {{ .Values.sandboxAgent.sandboxNamespace }}
  labels:
    app.kubernetes.io/managed-by: {{ $name }}
---
{{- end }}

# ConfigMap
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $name }}-config
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: sandbox-agent
    app.kubernetes.io/instance: {{ .Release.Name }}
data:
  config.yaml: |
    mode: {{ .Values.sandboxAgent.mode | default "kata" | quote }}
    http:
      addr: ":8080"
    grpc:
      addr: ":9090"
      dial_timeout: {{ .Values.sandboxAgent.grpcDialTimeout | default "5s" | quote }}
    kubernetes:
      resync_interval: {{ .Values.sandboxAgent.resyncInterval | default "5m" | quote }}
    {{- if .Values.sandboxAgent.nodeLabel.enabled }}
    node_label:
      enabled: true
      key: {{ .Values.sandboxAgent.nodeLabel.key | quote }}
      value: {{ .Values.sandboxAgent.nodeLabel.value | quote }}
    {{- end }}
    {{- if eq (.Values.sandboxAgent.mode | default "kata") "kata" }}
    agent:
      timeout: {{ .Values.sandboxAgent.agentTimeout | default "10s" | quote }}
      read_chunk_size: {{ .Values.sandboxAgent.readChunkSize | default 4096 }}
      max_output_size: {{ .Values.sandboxAgent.maxOutputBytes | default 1048576 }}
    {{- end }}
    {{- if eq (.Values.sandboxAgent.mode | default "kata") "pod" }}
    cri:
      socket: {{ .Values.sandboxAgent.cri.socket | default "" | quote }}
      timeout: {{ .Values.sandboxAgent.cri.timeout | default "30s" | quote }}
    hostfs:
      kubelet_root: {{ .Values.sandboxAgent.hostfs.kubeletRoot | default "/var/lib/kubelet" | quote }}
    {{- end }}
    exec:
      timeout: {{ .Values.sandboxAgent.execTimeout | default "30s" | quote }}
    sandbox:
      namespace: {{ .Values.sandboxAgent.sandboxNamespace | quote }}
      {{- if eq (.Values.sandboxAgent.mode | default "kata") "kata" }}
      runtime_class: {{ .Values.sandboxAgent.runtimeClass | quote }}
      {{- end }}
      {{- if or .Values.sandboxAgent.sandboxNodeSelector .Values.sandboxAgent.nodeLabel.enabled }}
      node_selector:
        {{- if .Values.sandboxAgent.nodeLabel.enabled }}
        {{ .Values.sandboxAgent.nodeLabel.key }}: {{ .Values.sandboxAgent.nodeLabel.value | quote }}
        {{- end }}
        {{- with .Values.sandboxAgent.sandboxNodeSelector }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- end }}
      {{- with .Values.sandboxAgent.sandboxTolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    {{- if .Values.sandboxAgent.fuseStorage.enabled }}
    fuse_storage:
      enabled: true
      image: {{ .Values.sandboxAgent.fuseStorage.image | quote }}
      endpoint: {{ .Values.sandboxAgent.fuseStorage.endpoint | quote }}
      region: {{ .Values.sandboxAgent.fuseStorage.region | quote }}
      assets_bucket: {{ .Values.sandboxAgent.fuseStorage.assetsBucket | quote }}
      access_key_id: {{ .Values.sandboxAgent.fuseStorage.accessKeyId | quote }}
      {{- if .Values.sandboxAgent.fuseStorage.secretAccessKeySecretRef }}
      secret_access_key_secret_name: {{ .Values.sandboxAgent.fuseStorage.secretAccessKeySecretRef.name | quote }}
      secret_access_key_secret_key: {{ .Values.sandboxAgent.fuseStorage.secretAccessKeySecretRef.key | default "secretAccessKey" | quote }}
      {{- else }}
      secret_access_key: {{ .Values.sandboxAgent.fuseStorage.secretAccessKey | quote }}
      {{- end }}
    {{- end }}
    {{- if .Values.sandboxAgent.activityDB.enabled }}
    activity_db:
      enabled: true
      path: {{ .Values.sandboxAgent.activityDB.path | quote }}
      filename: {{ .Values.sandboxAgent.activityDB.filename | quote }}
    {{- end }}
---

apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: sandbox-agent
    app.kubernetes.io/instance: {{ .Release.Name }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ $name }}
  labels:
    app.kubernetes.io/name: sandbox-agent
    app.kubernetes.io/instance: {{ .Release.Name }}
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch", "create", "delete", "patch", "update"]
  - apiGroups: [""]
    resources: ["nodes"]
    {{- if .Values.sandboxAgent.nodeLabel.enabled }}
    verbs: ["get", "list", "watch", "patch"]
    {{- else }}
    verbs: ["get", "list", "watch"]
    {{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ $name }}
  labels:
    app.kubernetes.io/name: sandbox-agent
    app.kubernetes.io/instance: {{ .Release.Name }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ $name }}
subjects:
  - kind: ServiceAccount
    name: {{ $name }}
    namespace: {{ .Release.Namespace }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: sandbox-agent
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: sandbox-agent
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: http
      port: 8080
      protocol: TCP
      targetPort: http
    - name: grpc
      port: 9090
      protocol: TCP
      targetPort: grpc
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: sandbox-agent
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: sandbox-agent
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sandbox-agent
        app.kubernetes.io/instance: {{ .Release.Name }}
      annotations:
        checksum/config: {{ printf "%s|%s|%s|%s|%s|%s|%s|%s|%v|%s|%s|%s|%v|%s|%s|%v|%s|%s|%s|%s|%v|%s|%s" .Values.sandboxAgent.mode .Values.sandboxAgent.sandboxNamespace .Values.sandboxAgent.runtimeClass .Values.sandboxAgent.grpcDialTimeout .Values.sandboxAgent.resyncInterval .Values.sandboxAgent.agentTimeout .Values.sandboxAgent.execTimeout .Values.sandboxAgent.maxOutputBytes .Values.sandboxAgent.sandboxNodeSelector .Values.sandboxAgent.cri.socket .Values.sandboxAgent.cri.timeout .Values.sandboxAgent.hostfs.kubeletRoot .Values.sandboxAgent.nodeLabel.enabled .Values.sandboxAgent.nodeLabel.key .Values.sandboxAgent.nodeLabel.value .Values.sandboxAgent.fuseStorage.enabled .Values.sandboxAgent.fuseStorage.image .Values.sandboxAgent.fuseStorage.endpoint .Values.sandboxAgent.fuseStorage.assetsBucket .Values.sandboxAgent.fuseStorage.region .Values.sandboxAgent.activityDB.enabled .Values.sandboxAgent.activityDB.path .Values.sandboxAgent.activityDB.filename | sha256sum }}
    spec:
      serviceAccountName: {{ $name }}
      {{- if eq (.Values.sandboxAgent.mode | default "kata") "pod" }}
      # Pod mode requires hostNetwork to access CRI streaming endpoint
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      {{- end }}
      {{- with .Values.sandboxAgent.nodeSelector }}
      nodeSelector:
{{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.sandboxAgent.tolerations }}
      tolerations:
{{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if .Values.sandboxAgent.nodeLabel.enabled }}
      # Allow time for graceful shutdown to unlabel node
      terminationGracePeriodSeconds: 30
      {{- end }}
      containers:
        - name: sandbox-agent
          image: {{ .Values.sandboxAgent.image.reference }}:{{ default .Chart.AppVersion .Values.sandboxAgent.image.tag }}
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          args:
            - --config=/etc/sandbox-agent/config.yaml
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
            - name: grpc
              containerPort: 9090
              protocol: TCP
          securityContext:
            runAsUser: 0
            runAsGroup: 0
          volumeMounts:
            - name: config
              mountPath: /etc/sandbox-agent
              readOnly: true
            {{- if .Values.sandboxAgent.activityDB.enabled }}
            - name: activity-db
              mountPath: {{ .Values.sandboxAgent.activityDB.path }}
            {{- end }}
            {{- if eq (.Values.sandboxAgent.mode | default "kata") "kata" }}
            # Kata mode: access to shim management sockets
            - name: shim-sockets
              mountPath: /run/vc/sbs
              readOnly: true
            - name: shim-sockets-rs
              mountPath: /run/kata
              readOnly: true
            - name: containerd-sock
              mountPath: /run/containerd
              readOnly: true
            {{- else }}
            # Pod mode: access to CRI socket and kubelet pods for emptyDir
            - name: cri-sock
              mountPath: /run/containerd
              readOnly: true
            - name: crio-sock
              mountPath: /var/run/crio
              readOnly: true
            - name: kubelet-pods
              mountPath: /var/lib/kubelet/pods
              readOnly: false
            {{- end }}
      volumes:
        - name: config
          configMap:
            name: {{ $name }}-config
        {{- if .Values.sandboxAgent.activityDB.enabled }}
        - name: activity-db
          hostPath:
            path: {{ .Values.sandboxAgent.activityDB.path }}
            type: DirectoryOrCreate
        {{- end }}
        {{- if eq (.Values.sandboxAgent.mode | default "kata") "kata" }}
        # Kata mode volumes
        - name: shim-sockets
          hostPath:
            path: /run/vc/sbs
            type: DirectoryOrCreate
        - name: shim-sockets-rs
          hostPath:
            path: /run/kata
            type: DirectoryOrCreate
        - name: containerd-sock
          hostPath:
            path: /run/containerd
            type: Directory
        {{- else }}
        # Pod mode volumes
        - name: cri-sock
          hostPath:
            path: /run/containerd
            type: DirectoryOrCreate
        - name: crio-sock
          hostPath:
            path: /var/run/crio
            type: DirectoryOrCreate
        - name: kubelet-pods
          hostPath:
            path: {{ .Values.sandboxAgent.hostfs.kubeletRoot | default "/var/lib/kubelet" }}/pods
            type: Directory
        {{- end }}
{{- end }}
