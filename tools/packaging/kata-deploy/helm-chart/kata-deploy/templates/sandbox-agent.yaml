{{- if .Values.sandboxAgent.enabled }}
{{- $name := printf "%s-sandbox-agent" .Chart.Name -}}
{{- if .Values.env.multiInstallSuffix }}
{{- $name = printf "%s-%s" $name .Values.env.multiInstallSuffix -}}
{{- end }}

# Namespace for sandbox pods (if different from release namespace)
{{- if ne .Values.sandboxAgent.sandboxNamespace .Release.Namespace }}
apiVersion: v1
kind: Namespace
metadata:
  name: {{ .Values.sandboxAgent.sandboxNamespace }}
  labels:
    app.kubernetes.io/managed-by: {{ $name }}
---
{{- end }}

# ConfigMap
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $name }}-config
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: sandbox-agent
    app.kubernetes.io/instance: {{ .Release.Name }}
data:
  config.yaml: |
    http:
      addr: ":8080"
    grpc:
      addr: ":9090"
      dial_timeout: {{ .Values.sandboxAgent.grpcDialTimeout | default "5s" | quote }}
    kubernetes:
      resync_interval: {{ .Values.sandboxAgent.resyncInterval | default "5m" | quote }}
    agent:
      timeout: {{ .Values.sandboxAgent.agentTimeout | default "10s" | quote }}
      read_chunk_size: {{ .Values.sandboxAgent.readChunkSize | default 4096 }}
      max_output_size: {{ .Values.sandboxAgent.maxOutputBytes | default 1048576 }}
    exec:
      timeout: {{ .Values.sandboxAgent.execTimeout | default "30s" | quote }}
    sandbox:
      namespace: {{ .Values.sandboxAgent.sandboxNamespace | quote }}
      runtime_class: {{ .Values.sandboxAgent.runtimeClass | quote }}
      default_image: {{ .Values.sandboxAgent.defaultImage | quote }}
      default_command: ["sleep", "infinity"]
      {{- with .Values.sandboxAgent.sandboxNodeSelector }}
      node_selector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
---

apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: sandbox-agent
    app.kubernetes.io/instance: {{ .Release.Name }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ $name }}
  labels:
    app.kubernetes.io/name: sandbox-agent
    app.kubernetes.io/instance: {{ .Release.Name }}
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch", "create", "delete", "patch", "update"]
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ $name }}
  labels:
    app.kubernetes.io/name: sandbox-agent
    app.kubernetes.io/instance: {{ .Release.Name }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ $name }}
subjects:
  - kind: ServiceAccount
    name: {{ $name }}
    namespace: {{ .Release.Namespace }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: sandbox-agent
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: sandbox-agent
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: http
      port: 8080
      protocol: TCP
      targetPort: http
    - name: grpc
      port: 9090
      protocol: TCP
      targetPort: grpc
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: sandbox-agent
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: sandbox-agent
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sandbox-agent
        app.kubernetes.io/instance: {{ .Release.Name }}
      annotations:
        checksum/config: {{ printf "%s|%s|%s|%s|%s|%s|%s|%s|%v" .Values.sandboxAgent.sandboxNamespace .Values.sandboxAgent.runtimeClass .Values.sandboxAgent.defaultImage .Values.sandboxAgent.grpcDialTimeout .Values.sandboxAgent.resyncInterval .Values.sandboxAgent.agentTimeout .Values.sandboxAgent.execTimeout .Values.sandboxAgent.maxOutputBytes .Values.sandboxAgent.sandboxNodeSelector | sha256sum }}
    spec:
      serviceAccountName: {{ $name }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
{{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
{{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: sandbox-agent
          image: {{ .Values.sandboxAgent.image.reference }}:{{ default .Chart.AppVersion .Values.sandboxAgent.image.tag }}
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          args:
            - --config=/etc/sandbox-agent/config.yaml
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
            - name: grpc
              containerPort: 9090
              protocol: TCP
          securityContext:
            runAsUser: 0
            runAsGroup: 0
          volumeMounts:
            - name: config
              mountPath: /etc/sandbox-agent
              readOnly: true
            - name: shim-sockets
              mountPath: /run/vc/sbs
              readOnly: true
            - name: shim-sockets-rs
              mountPath: /run/kata
              readOnly: true
            - name: containerd-sock
              mountPath: /run/containerd
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: {{ $name }}-config
        - name: shim-sockets
          hostPath:
            path: /run/vc/sbs
            type: DirectoryOrCreate
        - name: shim-sockets-rs
          hostPath:
            path: /run/kata
            type: DirectoryOrCreate
        - name: containerd-sock
          hostPath:
            path: /run/containerd
            type: Directory
{{- end }}
