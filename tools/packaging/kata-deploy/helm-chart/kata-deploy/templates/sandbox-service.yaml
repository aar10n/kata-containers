{{- if .Values.sandboxService.enabled }}
{{- $name := printf "%s-sandbox-service" .Chart.Name -}}
{{- $sandboxAgentName := printf "%s-sandbox-agent" .Chart.Name -}}
{{- if .Values.env.multiInstallSuffix }}
{{- $name = printf "%s-%s" $name .Values.env.multiInstallSuffix -}}
{{- $sandboxAgentName = printf "%s-%s" $sandboxAgentName .Values.env.multiInstallSuffix -}}
{{- end }}

# ServiceAccount for leader election
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: sandbox-service
    app.kubernetes.io/instance: {{ .Release.Name }}
---

# Role for leader election (Lease management)
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $name }}-leader-election
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: sandbox-service
    app.kubernetes.io/instance: {{ .Release.Name }}
rules:
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "watch", "list", "create", "update", "patch", "delete"]
---

# RoleBinding for leader election
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $name }}-leader-election
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: sandbox-service
    app.kubernetes.io/instance: {{ .Release.Name }}
subjects:
  - kind: ServiceAccount
    name: {{ $name }}
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: Role
  name: {{ $name }}-leader-election
  apiGroup: rbac.authorization.k8s.io
---

# ConfigMap
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $name }}-config
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: sandbox-service
    app.kubernetes.io/instance: {{ .Release.Name }}
data:
  config.yaml: |
    http:
      addr: ":8080"
    platform: kata
    kata:
      sandbox_agent_addr: "http://{{ $sandboxAgentName }}.{{ .Release.Namespace }}:8080"
    exec:
      default_timeout: 30s
      max_output_bytes: 1048576
    sandbox:
      default_ttl: {{ .Values.sandboxService.defaultTTL | default "10m" | quote }}
      cleanup_interval: {{ .Values.sandboxService.cleanupInterval | default "30s" | quote }}
---

# Service
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: sandbox-service
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: sandbox-service
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: http
      port: 8080
      protocol: TCP
      targetPort: http
---

# Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: sandbox-service
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  replicas: {{ .Values.sandboxService.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: sandbox-service
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sandbox-service
        app.kubernetes.io/instance: {{ .Release.Name }}
      annotations:
        checksum/config: {{ printf "%s|%s" .Values.sandboxService.defaultTTL .Values.sandboxService.cleanupInterval | sha256sum }}
    spec:
      serviceAccountName: {{ $name }}
      containers:
        - name: sandbox-service
          image: {{ .Values.sandboxService.image.reference }}:{{ default .Chart.AppVersion .Values.sandboxService.image.tag }}
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          args:
            - -c=/etc/sandbox-service/config.yaml
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            {{- toYaml .Values.sandboxService.resources | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /etc/sandbox-service
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: {{ $name }}-config
{{- end }}
