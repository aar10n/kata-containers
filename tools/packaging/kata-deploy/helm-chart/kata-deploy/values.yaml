# Enable/disable the kata-deploy daemonset and related resources (RBAC, cleanup job)
# Set to false to deploy only sandbox-service and sandbox-agent without Kata runtime components
kataDeploy:
  enabled: true

imagePullPolicy: Always

imagePullSecrets: []

image:
  reference: quay.io/kata-containers/kata-deploy
  tag: ""

k8sDistribution: "k8s"  # k8s, k3s, rke2, k0s, microk8s

# Node selector and tolerations to control which nodes the kata-deploy daemonset runs on
# Examples:
# nodeSelector:
#   kata-containers: "enabled"
#   node-type: "worker"
# tolerations:
#   - key: "reservedFor"
#     operator: "Exists"
#     effect: "NoSchedule"
nodeSelector: {}
tolerations: []

debug: false

snapshotter:
  setup: []  # ["nydus", "erofs"] or []

# Enable all available shims
shims:
  clh:
    enabled: true
    supportedArches:
      - amd64
      - arm64
    allowedHypervisorAnnotations: []
    containerd:
      snapshotter: ""

  cloud-hypervisor:
    enabled: true
    supportedArches:
      - amd64
      - arm64
    allowedHypervisorAnnotations: []
    containerd:
      snapshotter: ""

  dragonball:
    enabled: true
    supportedArches:
      - amd64
      - arm64
    allowedHypervisorAnnotations: []
    containerd:
      snapshotter: ""

  fc:
    enabled: true
    supportedArches:
      - amd64
      - arm64
    allowedHypervisorAnnotations: []
    containerd:
      snapshotter: "devmapper" # requires pre-configuration on the user side

  qemu:
    enabled: true
    supportedArches:
      - amd64
      - arm64
      - s390x
      - ppc64le
    allowedHypervisorAnnotations: []
    containerd:
      snapshotter: ""

  qemu-runtime-rs:
    enabled: true
    supportedArches:
      - amd64
      - s390x
    allowedHypervisorAnnotations: []
    containerd:
      snapshotter: ""

  qemu-nvidia-gpu:
    enabled: true
    supportedArches:
      - amd64
      - arm64
    allowedHypervisorAnnotations: []
    containerd:
      snapshotter: ""

  qemu-nvidia-gpu-snp:
    enabled: true
    supportedArches:
      - amd64
    allowedHypervisorAnnotations: []
    containerd:
      snapshotter: ""
      forceGuestPull: true
    crio:
      guestPull: true
    agent:
      httpsProxy: ""
      noProxy: ""

  qemu-nvidia-gpu-tdx:
    enabled: true
    supportedArches:
      - amd64
    allowedHypervisorAnnotations: []
    containerd:
      snapshotter: ""
      forceGuestPull: true
    crio:
      guestPull: true
    agent:
      httpsProxy: ""
      noProxy: ""

  qemu-snp:
    enabled: true
    supportedArches:
      - amd64
    allowedHypervisorAnnotations: []
    containerd:
      snapshotter: nydus
      forceGuestPull: false
    crio:
      guestPull: true
    agent:
      httpsProxy: ""
      noProxy: ""

  qemu-tdx:
    enabled: true
    supportedArches:
      - amd64
    allowedHypervisorAnnotations: []
    containerd:
      snapshotter: nydus
      forceGuestPull: false
    crio:
      guestPull: true
    agent:
      httpsProxy: ""
      noProxy: ""

  qemu-se:
    enabled: true
    supportedArches:
      - s390x
    allowedHypervisorAnnotations: []
    containerd:
      snapshotter: nydus
      forceGuestPull: false
    crio:
      guestPull: true
    agent:
      httpsProxy: ""
      noProxy: ""

  qemu-se-runtime-rs:
    enabled: true
    supportedArches:
      - s390x
    allowedHypervisorAnnotations: []
    containerd:
      snapshotter: nydus
      forceGuestPull: false
    crio:
      guestPull: true
    agent:
      httpsProxy: ""
      noProxy: ""

  qemu-cca:
    enabled: true
    supportedArches:
      - arm64
    allowedHypervisorAnnotations: []
    containerd:
      snapshotter: nydus
      forceGuestPull: false
    crio:
      guestPull: true
    agent:
      httpsProxy: ""
      noProxy: ""

  qemu-coco-dev:
    enabled: true
    supportedArches:
      - amd64
      - s390x
    allowedHypervisorAnnotations: []
    containerd:
      snapshotter: nydus
      forceGuestPull: false
    crio:
      guestPull: true
    agent:
      httpsProxy: ""
      noProxy: ""

  qemu-coco-dev-runtime-rs:
    enabled: true
    supportedArches:
      - amd64
      - s390x
    allowedHypervisorAnnotations: []
    containerd:
      snapshotter: nydus
      forceGuestPull: false
    crio:
      guestPull: true
    agent:
      httpsProxy: ""
      noProxy: ""

  remote:
    enabled: false
    supportedArches:
      - amd64
      - s390x
    allowedHypervisorAnnotations: []
    containerd:
      snapshotter: "nydus"
    crio:
      guestPull: true
    agent:
      httpsProxy: ""
      noProxy: ""

# Default shim per architecture
defaultShim:
  amd64: qemu
  arm64: qemu
  s390x: qemu
  ppc64le: qemu

runtimeClasses:
  enabled: true
  createDefault: false
  defaultName: "kata"

env:
  installationPrefix: ""
  hostOS: ""
  # Suffix for multi-install deployments to avoid conflicts between multiple Kata installations
  # NOTE: When set, the default RuntimeClass (runtimeClasses.createDefault) will NOT be created
  #       to avoid naming conflicts. Use fully qualified RuntimeClass names (e.g., kata-qemu-suffix1).
  multiInstallSuffix: ""

# Node Feature Discovery (NFD) configuration
# node-feature-discovery is used to detect hardware features, including virtualization support
#
# When enabled, kata-deploy will manage NFD as a subchart and enforce virtualization checks:
#   - x86_64: Requires Intel VT-x (VMX) or AMD-V (SVM) CPU features
#   - aarch64, s390x, ppc64le, riscv64: Always allowed (specific virt detection not yet implemented)
#
# NFD will use its default configuration which includes detecting CPU features like VMX and SVM
#
# IMPORTANT: If you already have node-feature-discovery installed independently in your
#            cluster, keep this disabled.
#
#            When disabled, NO virtualization checks will be enforced (we **DO NOT**
#            control any external node-feature-discovery configuration).
#
#            If you want virtualization checks with an external node-feature-discovery
#            deployment, use nodeSelector manually.
node-feature-discovery:
  enabled: false

# CRIU Installer DaemonSet configuration
# CRIU (Checkpoint/Restore In Userspace) is required for VM snapshot/restore functionality.
# This DaemonSet installs CRIU on nodes where Kata containers will run.
criuInstaller:
  enabled: false
  image: ubuntu:22.04
  # Installation method:
  #   - "package": Install via apt-get (recommended, requires internet access)
  #   - "binary": Download a static binary from a custom URL
  # Note: CRIU does not publish official pre-built static binaries.
  # The "binary" method requires you to provide a URL to a custom-built static binary.
  method: package
  # Only used when method is "binary" - URL to download the static CRIU binary
  # Example: https://your-artifacts-server.com/criu-static
  binaryUrl: ""

sandboxAgent:
  enabled: true
  image:
    reference: gcr.io/cohere-artifacts/sandbox-agent
    tag: ""

  # Mode: "kata" (Kata VMs with kata-agent) or "pod" (regular pods with CRI)
  mode: kata

  # Node selector for the sandbox-agent DaemonSet itself.
  # Use this to control which nodes run the sandbox-agent.
  # To limit the number of agents, pre-label specific nodes and select them here.
  # Example: { "sandbox-agent": "enabled" }
  nodeSelector: {}

  # Tolerations for the sandbox-agent DaemonSet.
  tolerations: []

  # Node labeling configuration.
  # When enabled, each sandbox-agent will label its node on startup.
  # This label is then used for scheduling sandbox pods to agent-ready nodes.
  nodeLabel:
    enabled: false
    key: "sandbox.kata.io/agent"
    value: "true"

  # Sandbox pod configuration
  sandboxNamespace: kata-sandboxes
  runtimeClass: kata-qemu  # Only used in kata mode
  # Node selector for sandbox pods. When nodeLabel is enabled, the agent's
  # node label is automatically added to ensure pods schedule to agent nodes.
  sandboxNodeSelector:
    katacontainers.io/kata-runtime: "true"

  # CRI configuration (pod mode only)
  cri:
    # Socket path - auto-detected if empty (tries containerd then CRI-O)
    socket: ""
    timeout: "30s"

  # Host filesystem configuration (pod mode only, for emptyDir access)
  hostfs:
    kubeletRoot: "/var/lib/kubelet"

sandboxService:
  enabled: true
  replicas: 1

  image:
    reference: gcr.io/cohere-artifacts/sandbox-service
    tag: ""

  # MCP server configuration
  mcp:
    enabled: true

  # Session/sandbox lifecycle settings
  defaultTTL: "10m"
  cleanupInterval: "30s"

  # Sandbox container defaults (applied when creating new sandboxes)
  defaultImage: "python:3.11-slim"
  defaultCommand: ["sleep", "infinity"]

  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
